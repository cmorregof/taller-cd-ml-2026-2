name: Fuentes de datos
on:
  schedule:
    - cron: "17 10 * * *"   # todos los días a las 5:17 a. m., hora de Colombia
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pruebas/probar_fuentes.py
